[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wot-lot-bot"
version = "0.1.0"
description = "Telegram bot that turns a Lolz Market WoT listing into lot images"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wot_lot_bot = ["templates/*.j2", "assets/*", "assets/fonts/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
